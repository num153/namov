name: Keep Supabase Awake

on:
  schedule:
    # Chạy vào 00:00 thứ 2, thứ 4, thứ 7 hàng tuần (cách 2-3 ngày 1 lần)
    - cron: '0 0 * * 1,3,6'
  workflow_dispatch: # Cho phép bấm chạy thủ công kiểm tra trên giao diện GitHub

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          echo "Sending keep-alive ping to Supabase..."
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" -X GET "https://ksyrtesvmqgozwomaqte.supabase.co/rest/v1/movies?select=id&limit=1" \
            -H "apikey: ${{ secrets.VITE_SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtzeXJ0ZXN2bXFnb3p3b21hcXRlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE1MjkyNjksImV4cCI6MjEwNzEwNTI2OX0.2VEfFTFhOxA-A80hmyjOK8bPE939YG1zKsvHHP_jBDc' }}" \
            -H "Authorization: Bearer ${{ secrets.VITE_SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtzeXJ0ZXN2bXFnb3p3b21hcXRlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE1MjkyNjksImV4cCI6MjEwNzEwNTI2OX0.2VEfFTFhOxA-A80hmyjOK8bPE939YG1zKsvHHP_jBDc' }}")
          echo "Supabase Response Status Code: $RESPONSE"
          if [ "$RESPONSE" -ge 200 ] && [ "$RESPONSE" -lt 400 ]; then
            echo "✅ Supabase is active and healthy!"
          else
            echo "⚠️ Response code: $RESPONSE"
          fi
